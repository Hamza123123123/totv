<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحميل TOTV+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            margin: 0;
            direction: rtl;
        }
        
        .container {
            text-align: center;
            color: #FFD700;
            padding: 20px;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,215,0,0.2);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .logo {
            width: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.8));
        }
        
        h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #FFD700, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p {
            color: #b3b3b3;
            margin-bottom: 20px;
        }
        
        a {
            color: #FFD700;
            text-decoration: none;
            border: 2px solid #FFD700;
            padding: 12px 30px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 20px;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        a:hover {
            background: #FFD700;
            color: #000;
            transform: translateY(-3px);
        }
        
        .note {
            color: #666;
            font-size: 0.8rem;
            margin-top: 30px;
        }
        
        .back-home {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            margin-top: 15px;
        }
        
        .back-home:hover {
            background: #FFD700;
        }
        
        .progress-bar {
            width: 80%;
            max-width: 300px;
            height: 4px;
            background: rgba(255,215,0,0.2);
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
        }
        
        .progress {
            width: 0%;
            height: 100%;
            background: #FFD700;
            border-radius: 10px;
            animation: loading 2s ease-out forwards;
        }
        
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="TOTV+" class="logo" onerror="this.src='https://via.placeholder.com/80x80?text=TOTV'">
        <h2>📱 TOTV+ Premium</h2>
        <p>جاري تجهيز ملف التحميل...</p>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        <p>سيبدأ التحميل خلال ثواني</p>
        <a href="https://github.com/Hamza123123123/totv/releases/download/v1/totv.apk">اضغط هنا إذا لم يبدأ التحميل</a>
        <br>
        <a href="index.html" class="back-home"><i class="fas fa-home"></i> العودة للصفحة الرئيسية</a>
        <p class="note">📱 يمكنك العودة للصفحة الرئيسية بعد التحميل</p>
    </div>

    <script>
        const downloadUrl = 'https://github.com/Hamza123123123/totv/releases/download/v1/totv.apk';
        
        window.onload = function() {
            setTimeout(function() {
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = 'totv.apk';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, 1000);
        }
    </script>
</body>
</html>
