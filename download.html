<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق TOTV+ | الموقع الرسمي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 { color: #f39c12; margin-bottom: 10px; }
        p { color: #bbb; margin-bottom: 30px; }
        .btn-download {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
        }
        .btn-download:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
        }
        .status { margin-top: 20px; font-size: 0.9rem; color: #888; }
    </style>
</head>
<body>

    <div class="container">
        <h1>تطبيق TOTV+</h1>
        <p>بوابتك لعالم الترفيه والرياضة</p>
        
        <a href="https://totv.app" id="downloadBtn" class="btn-download">تحميل التطبيق الآن (APK)</a>
        
        <div class="status" id="statusText">سيبدأ التحميل تلقائياً خلال ثوانٍ...</div>
    </div>

    <script>
        // دالة بدء التحميل
        function startDownload() {
            document.getElementById('statusText').innerText = "جاري بدء التحميل، يرجى الانتظار...";
            // التوجيه للدومين اللي ربطناه بقوقل درايف بـ Namecheap
            window.location.href = "https://totv.app";
        }

        // بدء التحميل تلقائياً بعد ثانية واحدة من دخول الصفحة
        window.onload = function() {
            setTimeout(startDownload, 1500);
        };

        // تفعيل التحميل عند ضغط الزر يدوياً
        document.getElementById('downloadBtn').onclick = function(e) {
            e.preventDefault();
            startDownload();
        };
    </script>

</body>
</html>
