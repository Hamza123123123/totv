    <script>
        // رابط التحميل المباشر من جوجل درايف الذي جهزناه
        const directDownloadUrl = "https://drive.google.com/uc?export=download&id=1apUQ-rYP9n-JYCenQq5L6K7eV1zPRZhP";

        function startDownload() {
            document.getElementById('statusText').innerText = "بدأ التحميل الآن... افحص الإشعارات";
            
            // إنشاء رابط مخفي والضغط عليه برمجياً
            const link = document.createElement('a');
            link.href = directDownloadUrl;
            link.setAttribute('download', 'totv.apk'); // إجبار المتصفح على التنزيل
            link.style.display = 'none';
            document.body.appendChild(link);
            
            link.click(); // محاكاة الضغط
            
            // تنظيف الكود بعد الضغط
            setTimeout(() => {
                document.body.removeChild(link);
            }, 100);
        }

        // بدء التحميل تلقائياً بعد دخول الصفحة بـ 2 ثانية
        window.onload = function() {
            setTimeout(startDownload, 2000);
        };

        // تفعيل التحميل عند ضغط الزر يدوياً
        document.getElementById('downloadBtn').onclick = function(e) {
            e.preventDefault();
            startDownload();
        };
    </script>
