<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحميل TOTV+</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            margin: 0;
            direction: rtl;
        }
        
        .container {
            text-align: center;
            color: #FFD700;
            padding: 20px;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,215,0,0.2);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .logo {
            width: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.8));
        }
        
        h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #FFD700, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p {
            color: #b3b3b3;
            margin-bottom: 20px;
        }
        
        /* زر التحميل الرئيسي - بدون رابط طويل */
        .download-main-btn {
            background: linear-gradient(135deg, #B8860B, #FFD700);
            color: #000;
            border: none;
            padding: 15px 45px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
        }
        
        .download-main-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255,215,0,0.6);
        }
        
        /* رابط احتياطي مخفي */
        .fallback-link {
            color: #FFD700;
            text-decoration: none;
            border: 1px solid rgba(255,215,0,0.3);
            padding: 8px 20px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 15px;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        
        .fallback-link:hover {
            background: rgba(255,215,0,0.2);
            border-color: #FFD700;
        }
        
        .back-home {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.3);
            margin-top: 20px;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            color: #FFD700;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .back-home:hover {
            background: #FFD700;
            color: #000;
        }
        
        .note {
            color: #666;
            font-size: 0.75rem;
            margin-top: 25px;
        }
        
        .progress-bar {
            width: 80%;
            max-width: 300px;
            height: 4px;
            background: rgba(255,215,0,0.2);
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
        }
        
        .progress {
            width: 0%;
            height: 100%;
            background: #FFD700;
            border-radius: 10px;
            animation: loading 2s ease-out forwards;
        }
        
        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        .hidden-link {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="TOTV+" class="logo" onerror="this.src='https://via.placeholder.com/80x80?text=TOTV'">
        <h2>📱 TOTV+ Premium</h2>
        <p>جاري تجهيز ملف التحميل...</p>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        
        <!-- زر التحميل الرئيسي - بدون رابط طويل -->
        <button class="download-main-btn" id="downloadBtn">
            <i class="fab fa-android"></i> تحميل التطبيق الآن
        </button>
        
        <br>
        <a href="index.html" class="back-home">
            <i class="fas fa-home"></i> العودة للصفحة الرئيسية
        </a>
        <p class="note">📱 سيبدأ التحميل تلقائياً خلال ثواني</p>
    </div>

    <script>
        // رابط التحميل الحقيقي (مخفي عن المستخدم)
        const downloadUrl = 'https://github.com/Hamza123123123/totv/releases/download/v1/totv.apk';
        
        // دالة بدء التحميل
        function startDownload() {
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = 'totv.apk';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // التحميل التلقائي عند فتح الصفحة
        window.onload = function() {
            setTimeout(function() {
                startDownload();
            }, 1500);
        }
        
        // عند الضغط على الزر
        document.getElementById('downloadBtn').onclick = function() {
            startDownload();
        }
    </script>
</body>
</html>
