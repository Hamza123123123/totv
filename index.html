        /* أيقونة القائمة (الثلاث خطوط) */
        .menu-icon {
            position: fixed; top: 20px; right: 20px; font-size: 30px; color: #ffcc00; cursor: pointer; z-index: 1000;
        }

        /* القائمة الجانبية */
        .sidebar {

        .sidebar.active { right: 0; }
        .sidebar h2 { color: #ffcc00; font-size: 1.5rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li { padding: 15px 0; border-bottom: 1px solid #222; color: #bbb; }
        .sidebar ul li b { color: #ffcc00; }
        
        /* تنسيق زر التيليجرام داخل القائمة */
        .tg-link {
            display: block; margin-top: 20px; padding: 12px; background: #0088cc; color: #fff;
            text-decoration: none; border-radius: 10px; text-align: center; font-weight: bold; transition: 0.3s;
        }
        .tg-link:hover { background: #00aaff; }

        /* المحتوى الرئيسي */
        .main-content { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
        .card { background: rgba(15, 15, 15, 0.9); padding: 40px; border-radius: 25px; border: 1px solid #222; max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo { max-width: 200px; margin-bottom: 20px; }
        h1 { color: #ffcc00; font-size: 1.6rem; margin-bottom: 10px; }
        p { color: #888; line-height: 1.6; }
        .btn { background: #ffcc00; color: #000; padding: 15px 30px; text-decoration: none; border-radius: 50px; font-weight: bold; display: inline-block; margin-top: 20px; transition: 0.3s; font-size: 1.1rem; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,204,0,0.3); }

        /* طبقة تظليل عند فتح القائمة */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 998; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

            <a href="app.apk" class="btn">📥 تحميل للأندرويد APK</a>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');

</body>
</html>
